{% extends "base.html" %}
{% block title %}Settings · Mail Pulse{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Settings</h1>
    <p>Use your own SMTP account. Gmail: enable 2FA and create an App Password. SendGrid/Mailgun/Resend SMTP also work.</p>
  </div>
</header>

<form method="post" class="card form">
  <label>SMTP host
    <input type="text" name="smtp_host" value="{{ settings.smtp_host }}" placeholder="smtp.gmail.com" required />
  </label>
  <label>SMTP port
    <input type="number" name="smtp_port" value="{{ settings.smtp_port }}" />
  </label>
  <label>SMTP username
    <input type="text" name="smtp_user" value="{{ settings.smtp_user }}" />
  </label>
  <label>SMTP password{% if settings.smtp_password %} (leave blank to keep current){% endif %}
    <input type="password" name="smtp_password" autocomplete="new-password" />
  </label>
  <label class="check">
    <input type="checkbox" name="smtp_use_tls" {% if settings.smtp_use_tls %}checked{% endif %} />
    Use STARTTLS
  </label>
  <label>From email
    <input type="email" name="from_email" value="{{ settings.from_email }}" required />
  </label>
  <label>From name
    <input type="text" name="from_name" value="{{ settings.from_name }}" />
  </label>
  <label>Public site URL (needed so open/click tracking can reach this app)
    {% if space_url %}
      <input type="url" name="public_base_url" value="{{ space_url }}" readonly />
    {% else %}
      <input type="url" name="public_base_url" value="{{ settings.public_base_url }}" placeholder="https://your-domain.com" />
    {% endif %}
  </label>
  <label>Physical mailing address (required by US CAN-SPAM)
    <input type="text" name="physical_address" value="{{ settings.physical_address }}" placeholder="123 Main St, City, Country" />
  </label>
  <button type="submit">Save settings</button>
</form>
{% endblock %}
